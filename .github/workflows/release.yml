name: release
on:
  push:
    tags:
      - "v*"
jobs:
  zip:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 9
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm test
      - name: Package zip
        run: |
          chmod +x package.sh
          ./package.sh
          cp ../deck-live.zip deck-live.zip
          cp ../deck-live.zip "deck-live-${GITHUB_REF_NAME}.zip"
      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            deck-live.zip
            deck-live-${{ github.ref_name }}.zip
          generate_release_notes: true
